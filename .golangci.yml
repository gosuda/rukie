version: "2"
run:
  timeout: 5m
  go: "1.27"
  build-tags: [integration, e2e, perf, render]
linters:
  default: standard
  enable: [errcheck, errorlint, exhaustive, gocritic, gosec, govet, ineffassign, revive, staticcheck, unused, wastedassign]
  settings:
    errorlint: {errorf: true, asserts: true, comparison: true}
    exhaustive: {default-signifies-exhaustive: false}
    govet: {enable-all: true}
    staticcheck: {checks: ["all"]}
  exclusions:
    presets: [comments]
    rules:
      - path: ^internal/rukproc/
        text: G204|G703
        linters: [gosec]
      # Repo import shells to stock git with fixed subcommands and a `--`
      # separator; sources and remotes are operator-supplied paths and URLs,
      # never a shell string.
      - path: ^internal/cli/admin_f14\.go$
        text: G204
        linters: [gosec]
      - path: _test\.go$
        linters: [gosec]
      - path: ^internal/op/mount_huma\.go$
        text: G705
        linters: [gosec]
# refused_by: statement_fold · collision: none (1 contested hunk(s), neither side deleted the other's lines)
      # The CI artifact log/blob handler serves store bytes with a sniffed
      # content type, like the raw-blob handler above; the sink is the
      # content-addressed artifact store, never reflected markup.
      - path: ^internal/api/ci_runner\.go$
        text: G705
        linters: [gosec]
      # SSH string length prefixes encode protocol-small statement fields
      # already held in memory; no field approaches 4 GiB.
      - path: ^internal/ci/signature\.go$
        text: G115
      # Release notes render through goldmark with no unsafe mode into
      # trusted.HTML; releases_views.go only emits that checked markup.
      - path: ^internal/api/releases_views\.go$
        text: G705
        linters: [gosec]
      # RFC 6238 mandates HMAC-SHA-1 for TOTP; totp.go is its only user here.
      - path: ^internal/auth/totp\.go$
        text: G505
        linters: [gosec]
      - path: ^internal/gitssh/exec\.go$
        text: G115
        linters: [gosec]
      - path: ^internal/store/auth_token\.go$
        text: G101
        linters: [gosec]
      # The job spec string runs as the runner uid; it executes inside
      # the container in production and on the host only under tests.
      - path: ^internal/runner/exec\.go$
        text: G204
        linters: [gosec]
      # Podman resolves via LookPath or explicit runner.toml config with
      # a fixed argument builder and no caller-controlled flags.
      - path: ^internal/runner/probe\.go$
        text: G204
        linters: [gosec]
      # Git and podman run with fixed subcommands, bounded timeouts, and
      # resolved binary paths; the timeout cause aborts hung children.
      - path: ^internal/runner/sandbox\.go$
        text: G204
        linters: [gosec]
      # Job-spec and step outputs live under attempt dirs; container-written
      # logs open with O_NOFOLLOW and require regular files.
      - path: ^internal/runner/exec\.go$
        text: G304
        linters: [gosec]
      # Probe reads fixed host paths under /proc, /sys, and /etc.
      - path: ^internal/runner/probe\.go$
        text: G304
        linters: [gosec]
      # Config and credential live under the 0700 state directory.
      - path: ^internal/runner/runner\.go$
        text: G304
        linters: [gosec]
      # Mirror blobs, artifacts, and logs resolve under validated roots
      # with Clean plus escape checks and symlink guards.
      - path: ^internal/runner/sandbox\.go$
        text: G304
        linters: [gosec]
      # The operator-supplied token file path is mode-checked before read.
      - path: ^internal/runner/commands\.go$
        text: G304
        linters: [gosec]
      # Attempt token and result live under the state dir attempt layout.
      - path: ^internal/runner/loop\.go$
        text: G304
        linters: [gosec]
      # The container executor copy needs the exec bit to run job-exec.
      - path: ^internal/runner/sandbox\.go$
        text: G306|G703
        linters: [gosec]
      # Daemon wire JSON key order is pinned by golden tests
      # (TestPushArgsMarshalGolden, TestInvocationOpenAuthOmission); reordering
      # these fields would change the wire format.
      - path: ^internal/ruk/push\.go$
        text: (PushUpdate has|struct has)
        linters: [govet]
      - path: ^internal/ruk/wire/wire\.go$
        text: InvocationOpen has
        linters: [govet]
formatters:
  enable: [gofmt, goimports]
