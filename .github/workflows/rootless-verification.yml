name: Verify rootless sandbox setup
on:
  push:
    branches: [ci/verify-rootless-rukie-20261126]
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: candidate
jobs:
  verify:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 69d9ac18adb29316eb77de2cc81113c74ebde36a
          persist-credentials: false
          path: candidate
      - name: Check exact candidate and init
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          test "$(git rev-parse HEAD)" = 69d9ac18adb29316eb77de2cc81113c74ebde36a
          printf '%s  %s\n' ed41eaf21d103907f0de27266fa204efcb7e7e644562dd743d9c1705d11da987 ../probe/ci-tools/rukie-round7.patch | sha256sum --check --strict
          git apply --index --whitespace=error ../probe/ci-tools/rukie-round7.patch
          test "$(git write-tree)" = cfd2e7b4ae46efc24f9eb1c9133e34bb2caf13ae
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/source.txt"
          git write-tree >> "$GITHUB_WORKSPACE/evidence/source.txt"
          ps -p 1 -o comm=
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.4
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Prove the old delegation check fails
        run: uv run --no-project --python 3.13 ../probe/ci-tools/rukie-delegation-red.py
      - name: Provision rootless Podman
        run: tools/passgate.sh -- bash -x tools/ci-podman.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/setup.log"
      - name: Verify all Rukie gates and mandatory live probe
        run: |
          tools/passgate.sh '--- PASS: TestSandboxP11LiveProbe (' -- make check 2>&1 | tee "$GITHUB_WORKSPACE/evidence/check.log"
      - name: Recheck source identity
        if: ${{ !cancelled() }}
        run: |
          test "$(git write-tree)" = cfd2e7b4ae46efc24f9eb1c9133e34bb2caf13ae
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: rukie-rootless-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
