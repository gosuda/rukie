# Native Depot copy of .github/workflows/ci.yml. Fork pull requests
# do not start Depot workflows, so .github/workflows/ci.yml stays
# their CI path.
name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  rukie:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the Go toolchain
        id: go_toolchain
        run: |
          go_version=$(sed -n 's/^toolchain go//p' go.mod)
          [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$go_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go_toolchain.outputs.version }}
          cache: false
      - name: Provide podman for the sandbox probe
        run: |
          command -v apt-get || { echo "E_NO_APT: Depot image has no apt-get"; exit 1; }
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          $SUDO apt-get update
          podman_version=$(apt-cache madison podman | awk 'NR==1 {print $3}')
          [ -n "$podman_version" ] || { echo "E_NO_PODMAN_CANDIDATE"; exit 1; }
          $SUDO apt-get install -y --no-install-recommends "podman=${podman_version}"
          USER_NAME=$(id -un); USER_GID=$(id -g)
          echo "user=$USER_NAME uid=$(id -u) gid=$USER_GID groups=$(id -G)"
          grep -q "^$USER_NAME:" /etc/subuid || echo "$USER_NAME:165536:65536" | $SUDO tee -a /etc/subuid
          grep -q "^$USER_NAME:" /etc/subgid || echo "$USER_NAME:165536:65536" | $SUDO tee -a /etc/subgid
          PASSWD_GID=$(awk -F: -v u="$USER_NAME" '$1==u {print $4}' /etc/passwd)
          if [ "$PASSWD_GID" != "$USER_GID" ]; then
            $SUDO sed -i -E "s/^($USER_NAME:[^:]*:[0-9]+:)[0-9]+:/\1$USER_GID:/" /etc/passwd
          fi
          grep "^$USER_NAME:" /etc/passwd /etc/subuid /etc/subgid
          mkdir -p "$HOME/.config/containers" "$RUNNER_TEMP/podman-run" "$RUNNER_TEMP/podman-root"
          cat > "$HOME/.config/containers/storage.conf" <<EOF
          [storage]
          driver = "vfs"
          runroot = "$RUNNER_TEMP/podman-run"
          graphroot = "$RUNNER_TEMP/podman-root"
          EOF
          podman --storage-driver vfs version --format json
      - run: |
          make check
  ruk-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the Go toolchain
        id: go_toolchain
        run: |
          go_version=$(sed -n 's/^toolchain go//p' go.mod)
          [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$go_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go_toolchain.outputs.version }}
          cache: false
      - name: Check out pinned Ruk
        id: checkout-ruk
        run: |
          ruk_revision=$(<tools/ruk.pin)
          [[ "$ruk_revision" =~ ^[0-9a-f]{40}$ ]]
          git init ruk
          git -C ruk remote add origin https://github.com/gosuda/ruk.git
          git -C ruk fetch --no-tags --depth 1 origin "$ruk_revision"
          git -C ruk checkout --detach FETCH_HEAD
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
        id: rustup
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        id: nextest
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - run: |
          cargo fmt --all -- --check
        working-directory: ruk
        id: rust-fmt
      - run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: ${{ !cancelled() }}
        id: rust-clippy
        working-directory: ruk
      - run: |
          cargo nextest run --workspace --locked --no-fail-fast
        working-directory: ruk
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        id: rust-nextest
      - run: |
          cargo test --workspace --locked --doc --no-fail-fast
        working-directory: ruk
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        id: rust-doc
      - run: |
          cargo build --manifest-path ruk/Cargo.toml --locked -p ruk
        if: ${{ !cancelled() && steps.checkout-ruk.outcome == 'success' && steps.rustup.outcome == 'success' && steps.nextest.outcome == 'success' }}
        id: build-ruk
      - name: Export the pinned Ruk model
        run: |
          ruk/target/debug/ruk model --format json > "$RUNNER_TEMP/ruk-model.json"
        if: ${{ !cancelled() && steps.build-ruk.outcome == 'success' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruk-model-${{ github.sha }}
          path: ${{ runner.temp }}/ruk-model.json
          if-no-files-found: error
          retention-days: 7
        if: ${{ !cancelled() && steps.build-ruk.outcome == 'success' }}
      - name: Test the daemon, SSH, and application startup
        run: |
          tools/passgate.sh \
            '--- PASS: TestDaemonLifecycle (' \
            '--- PASS: TestModelCLIMatchesSnapshot (' \
            '--- PASS: TestDaemonPushReconcilePagination (' \
            '--- PASS: TestGCRejectsUnavailableDaemonRepos (' \
            '--- PASS: TestSSHStockGitCloneAndPush (' \
            '--- PASS: TestDevLoopStarts (' -- \
            env RUK_BIN="$GITHUB_WORKSPACE/ruk/target/debug/ruk" RUK_COORDINATOR=off \
            go test -race -count=1 -v -timeout 30m -tags integration \
            ./internal/ruk/... ./internal/gitssh/... ./internal/sysops/... ./cmd/rukie/...
        if: ${{ !cancelled() && steps.build-ruk.outcome == 'success' }}
      - name: Test Git and agent workflows against the daemon
        run: |
          tools/passgate.sh \
            '--- PASS: TestGitPushFetchRoundTrip (' \
            '--- PASS: TestConcurrentPushesSerialize (' \
            '--- PASS: TestRepositoryPurgeUsesOpenedPath (' \
            '--- PASS: TestAgentFlow (' \
            '--- PASS: TestAgentFlow/change (' -- \
            env RUK_BIN="$GITHUB_WORKSPACE/ruk/target/debug/ruk" RUK_COORDINATOR=off \
            go test -race -count=1 -v -timeout 30m -tags e2e ./tests/e2e/...
        if: ${{ !cancelled() && steps.build-ruk.outcome == 'success' }}
